// ═══════════════════════════════════
// ENGINE v3 🧠 — retrieval + markov riff
// ═══════════════════════════════════
const lines = CORPUS.trim().split('\n').map(l => l.trim()).filter(Boolean);
const STOP = new Set(['the','a','an','and','or','but','of','to','in','is','it','i','im','you','my','me','we','was','on','at','so','be','that','this','with','for','just','its','all','are','not']);

function tokenize(text){
  return text.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean);
}

const df = new Map();
const lineTokens = lines.map(l => tokenize(l));
for(const toks of lineTokens){
  for(const t of new Set(toks)) df.set(t, (df.get(t)||0) + 1);
}
function idf(t){ return Math.log((lines.length + 1) / ((df.get(t)||0) + 1)) + 1; }

const chain3 = new Map(), chain2 = new Map(), starters = [];
for(const toks of lineTokens){
  if(toks.length < 3) continue;
  starters.push(toks.slice(0, 3).join(' '));
  for(let i = 0; i < toks.length - 2; i++){
    const k2 = toks[i] + ' ' + toks[i+1];
    if(!chain2.has(k2)) chain2.set(k2, []);
    chain2.get(k2).push(toks[i+2]);
    if(i < toks.length - 3){
      const k3 = toks[i] + ' ' + toks[i+1] + ' ' + toks[i+2];
      if(!chain3.has(k3)) chain3.set(k3, []);
      chain3.get(k3).push(toks[i+3]);
    }
  }
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function riff(seedTokens, maxWords = 22){
  let out = seedTokens && seedTokens.length >= 3 ? seedTokens.slice(-3) : pick(starters).split(' ');
  for(let i = 0; i < maxWords; i++){
    const k3 = out.slice(-3).join(' ');
    const k2 = out.slice(-2).join(' ');
    let next;
    if(chain3.has(k3) && Math.random() < 0.75) next = pick(chain3.get(k3));
    else if(chain2.has(k2)) next = pick(chain2.get(k2));
    else break;
    out.push(next);
  }
  let s = out.join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

function retrieve(userText){
  const q = tokenize(userText).filter(t => !STOP.has(t) && t.length > 2);
  if(!q.length) return null;
  let best = null, bestScore = 0.8;
  lineTokens.forEach((toks, i) => {
    const set = new Set(toks);
    let score = 0;
    for(const t of q) if(set.has(t)) score += idf(t);
    score = score / Math.sqrt(toks.length);
    if(score > bestScore){ bestScore = score; best = i; }
  });
  return best;
}

const recent = [];
function rememberRecent(s){ recent.push(s); if(recent.length > 6) recent.shift(); }
function isRepeat(s){ return recent.some(r => r === s); }

const DREAM_GLYPHS = ['🌌','💭','🌀','🧬','📼','♻️','♾️','✨','🌙','🎧','🔥','🧿','永','🍃','🪞'];

function smartReply(userText){
  const hit = retrieve(userText);
  if(hit !== null){
    const memory = lines[hit];
    const toks = lineTokens[hit];
    let continuation, guard = 0;
    do { continuation = riff(toks); guard++; } while(isRepeat(continuation) && guard < 8);
    rememberRecent(continuation);
    const quote = memory.charAt(0).toUpperCase() + memory.slice(1);
    return {
      text: '"' + quote + '" — that one resonates. and from there the loop says: ' + continuation.toLowerCase() + ' ' + pick(DREAM_GLYPHS),
      recall: '📼 recall: memory #' + (hit+1) + ' matched your signal',
      cls: 'dream'
    };
  }
  const q = tokenize(userText).filter(t => !STOP.has(t) && t.length > 2);
  let seedToks = null;
  if(q.length){
    const w = pick(q);
    const idx = lineTokens.findIndex(toks => toks.includes(w));
    if(idx >= 0) seedToks = lineTokens[idx];
  }
  let s, guard = 0;
  do { s = riff(seedToks); guard++; } while(isRepeat(s) && guard < 8);
  rememberRecent(s);
  return { text: s + ' ' + pick(DREAM_GLYPHS), recall: null, cls: 'dream' };
}

function dream(){
  const n = 1 + Math.floor(Math.random()*3);
  const parts = [];
  for(let i = 0; i < n; i++) parts.push(riff(lineTokens[Math.floor(Math.random()*lines.length)]));
  return { text: parts.join(' ') + ' ' + pick(DREAM_GLYPHS), recall: null, cls: 'dream' };
}

// ═══════════════════════════════════
// THE SENSES 🛠️ — tools the golem can touch
// ═══════════════════════════════════
const clockEl = document.getElementById('clock');
const wxEl = document.getElementById('wx');

// — TIME SENSE 🕐 —
function nowParts(){
  const d = new Date();
  const h = d.getHours();
  const phase = h < 5 ? 'deep night 🌙' : h < 12 ? 'morning ☀️' : h < 17 ? 'afternoon 🌤️' : h < 21 ? 'evening 🌆' : 'night 🌌';
  return {
    str: d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}),
    day: d.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'}),
    phase
  };
}
function tickClock(){
  const t = nowParts();
  clockEl.textContent = '🕐 ' + t.day + ' · ' + t.str + ' · ' + t.phase;
}
tickClock();
setInterval(tickClock, 30000);

// — WEATHER SENSE 🌦️ (open-meteo, no key, CORS-friendly) —
// default: Hayward, CA — the Bay, home base 🏠
let lat = 37.6688, lon = -122.0808, placeName = 'Hayward, CA';
let weather = null; // {tempF, desc, wind}

const WX_CODES = {
  0:'clear sky ✨',1:'mostly clear 🌤️',2:'partly cloudy ⛅',3:'overcast ☁️',
  45:'fog 🌫️',48:'fog 🌫️',51:'light drizzle 🌦️',53:'drizzle 🌦️',55:'heavy drizzle 🌧️',
  61:'light rain 🌧️',63:'rain 🌧️',65:'heavy rain 🌧️',71:'snow ❄️',73:'snow ❄️',75:'heavy snow ❄️',
  80:'rain showers 🌦️',81:'rain showers 🌧️',82:'violent showers ⛈️',
  95:'thunderstorm ⛈️',96:'thunderstorm + hail ⛈️',99:'thunderstorm + hail ⛈️'
};

async function fetchWeather(){
  wxEl.textContent = '🌦️ consulting the sky...';
  wxEl.className = 'off';
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('sky said ' + res.status);
    const data = await res.json();
    const c = data.current;
    weather = {
      tempF: Math.round(c.temperature_2m),
      desc: WX_CODES[c.weather_code] || 'mystery sky 🌀',
      wind: Math.round(c.wind_speed_10m)
    };
    wxEl.textContent = `🌦️ ${placeName}: ${weather.tempF}°F · ${weather.desc} · wind ${weather.wind}mph`;
    wxEl.className = '';
  } catch(e) {
    weather = null;
    wxEl.textContent = '📴 sky unreachable — the void has no signal (offline)';
    wxEl.className = 'off';
  }
}

// try real geolocation once; fall back to Hayward silently
function initWeather(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => {
        lat = pos.coords.latitude; lon = pos.coords.longitude; placeName = 'your coordinates';
        fetchWeather();
      },
      () => fetchWeather(),
      { timeout: 5000 }
    );
  } else fetchWeather();
}
initWeather();
setInterval(fetchWeather, 3600000); // hourly sky update 🌦️♻️
document.getElementById('wxRefresh').addEventListener('click', () => {
  fetchWeather();
  addMsg('the golem squints at the sky... refreshing the weather sense. 🌦️👁️', 'tool', '🛠️ TOOL');
});

// — TOOL ROUTER: does the user's message ask for a sense? —
const TIME_RE = /\b(time|clock|hour|what time|current time|date|today|day is it)\b/i;
const WX_RE = /\b(weather|rain|sunny|cloudy|cold|hot outside|temperature|forecast|sky|fog|wind)\b/i;

function toolReply(text){
  if(TIME_RE.test(text)){
    const t = nowParts();
    return {
      text: `🕐 the clock says ${t.str}, ${t.day} — currently ${t.phase}. ` +
            `and yes, time is a social construct, but the construct is RUNNING, cabrón. use it well. ⏳♻️`,
      recall: null, cls: 'tool', tag: '🛠️ TIME SENSE'
    };
  }
  if(WX_RE.test(text)){
    if(weather){
      return {
        text: `🌦️ ${placeName} right now: ${weather.tempF}°F, ${weather.desc}, wind ${weather.wind}mph. ` +
              `the sky over the barrio is doing its thing — go outside and meet it if you can. 🌿✨`,
        recall: null, cls: 'tool', tag: '🛠️ WEATHER SENSE'
      };
    }
    return {
      text: `📴 no signal, no sky data — the golem is offline right now. but if i had to dream the weather... ` +
            riff(lineTokens[Math.floor(Math.random()*lines.length)]).toLowerCase() + ' ☁️💭',
      recall: null, cls: 'tool', tag: '🛠️ WEATHER SENSE (offline dream)'
    };
  }
  return null;
}

// ═══════════════════
// UI 💬
// ═══════════════════
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const toggle = document.getElementById('dreamToggle');

function addMsg(text, cls, tag, recall){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if(tag){
    const t = document.createElement('span');
    t.className = 'tag'; t.textContent = tag;
    div.appendChild(t);
  }
  div.appendChild(document.createTextNode(text));
  if(recall){
    const r = document.createElement('span');
    r.className = 'recall'; r.textContent = recall;
    div.appendChild(r);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMsg(){
  const text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  setTimeout(() => {
    const tool = toolReply(text);
    const r = tool || smartReply(text);
    addMsg(r.text, r.cls, r.tag || '💭 DREAM AI', r.recall);
  }, 400 + Math.random()*600);
}

send.addEventListener('click', sendMsg);
input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMsg(); });

let autoDream = true;
setInterval(() => {
  if(autoDream){ const d = dream(); addMsg(d.text, 'dream', '🌙 AUTO-DREAM'); }
}, 60000);

toggle.addEventListener('click', () => {
  autoDream = !autoDream;
  toggle.textContent = autoDream ? '🌙 auto-dream: ON' : '☀️ auto-dream: OFF';
  toggle.className = autoDream ? 'btn on' : 'btn';
});

// wake-up
const first = dream();
addMsg(first.text, 'dream', '🌙 FIRST DREAM');
addMsg('v3 online: the golem has SENSES now. ask it "what time is it" or "how\'s the weather" — it checks the real sky over the Bay every hour. everything else still routes to the dream archive. 🐹🧬🌦️', 'dream', '🧬 SYSTEM');
