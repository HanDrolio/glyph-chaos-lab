// ═══════════════════════════════
// MARKOV ENGINE (order 2) 🧠
// ═══════════════════════════════
const chain = new Map();
const starters = [];

function tokenize(text){
  return text.toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').split(/\s+/).filter(Boolean);
}

const lines = CORPUS.trim().split('\n');
for(const line of lines){
  const words = tokenize(line);
  if(words.length < 3) continue;
  starters.push([words[0], words[1]]);
  for(let i = 0; i < words.length - 2; i++){
    const key = words[i] + ' ' + words[i+1];
    if(!chain.has(key)) chain.set(key, []);
    chain.get(key).push(words[i+2]);
  }
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generate(seedWord, maxWords = 26){
  let key;
  if(seedWord){
    // find a chain key containing the seed
    const candidates = [...chain.keys()].filter(k => k.split(' ').includes(seedWord.toLowerCase()));
    if(candidates.length) key = pick(candidates);
  }
  if(!key){
    const s = pick(starters);
    key = s[0] + ' ' + s[1];
  }
  const out = key.split(' ');
  for(let i = 0; i < maxWords; i++){
    const nexts = chain.get(out[out.length-2] + ' ' + out[out.length-1]);
    if(!nexts) break;
    out.push(pick(nexts));
  }
  let sentence = out.join(' ');
  return sentence.charAt(0).toUpperCase() + sentence.slice(1) + '.';
}

// dream = 1-3 markov sentences stitched, sprinkled with glyphs
const DREAM_GLYPHS = ['🌌','💭','🌀','🧬','📼','♻️','♾️','✨','🌙','🎧','🔥','🧿','永'];
function dream(){
  const n = 1 + Math.floor(Math.random()*3);
  const parts = [];
  for(let i = 0; i < n; i++) parts.push(generate());
  return parts.join(' ') + ' ' + pick(DREAM_GLYPHS);
}

// reply = try to seed from user's words
function reply(text){
  const words = tokenize(text).filter(w => w.length > 3);
  const seed = words.length ? pick(words) : null;
  return generate(seed) + ' ' + pick(DREAM_GLYPHS);
}

// UI 💬
// ═══════════════════════════════
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const toggle = document.getElementById('dreamToggle');

function addMsg(text, cls, tag){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if(tag){
    const t = document.createElement('span');
    t.className = 'tag';
    t.textContent = tag;
    div.appendChild(t);
  }
  div.appendChild(document.createTextNode(text));
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMsg(){
  const text = input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value = '';
  setTimeout(() => addMsg(reply(text), 'dream', '💭 DREAM AI'), 400 + Math.random()*600);
}

send.addEventListener('click', sendMsg);
input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMsg(); });
