// ═══════════════ RETRIEVAL + MARKOV 🧬 ═══════════════
const lines = CORPUS.trim().split('\n').map(l => l.trim()).filter(Boolean);
const STOP = new Set(['the','a','an','and','or','but','of','to','in','is','it','i','im','you','my','me','we','was','on','at','so','be','that','this','with','for','just','its','all','are','not']);
function tokenize(text){ return text.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean); }
const df = new Map();
const lineTokens = lines.map(l => tokenize(l));
for(const toks of lineTokens) for(const t of new Set(toks)) df.set(t, (df.get(t)||0) + 1);
function idf(t){ return Math.log((lines.length + 1) / ((df.get(t)||0) + 1)) + 1; }
function retrieveTop(userText, n = 3){
  const q = tokenize(userText).filter(t => !STOP.has(t) && t.length > 2);
  if(!q.length) return [];
  return lineTokens.map((toks, i) => {
    const set = new Set(toks); let score = 0;
    for(const t of q) if(set.has(t)) score += idf(t);
    return [score / Math.sqrt(toks.length), i];
  }).filter(([s]) => s > 0.8).sort((a,b) => b[0]-a[0]).slice(0, n).map(([,i]) => i);
}
const chain2 = new Map(), starters = [];
for(const toks of lineTokens){
  if(toks.length < 3) continue;
  starters.push(toks.slice(0,2).join(' '));
  for(let i = 0; i < toks.length - 2; i++){
    const k = toks[i] + ' ' + toks[i+1];
    if(!chain2.has(k)) chain2.set(k, []);
    chain2.get(k).push(toks[i+2]);
  }
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function riff(seedTokens, maxWords = 22){
  let out = seedTokens && seedTokens.length >= 2 ? seedTokens.slice(-2) : pick(starters).split(' ');
  for(let i = 0; i < maxWords; i++){
    const nexts = chain2.get(out.slice(-2).join(' '));
    if(!nexts) break;
    out.push(pick(nexts));
  }
  let s = out.join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

  return { str: d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}), day: d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'}), phase };
}
function tickClock(){ const t = nowParts(); clockEl.textContent = '🕐 ' + t.day + ' · ' + t.str + ' · ' + t.phase; }
tickClock(); setInterval(tickClock, 30000);

let lat = 37.6688, lon = -122.0808, placeName = 'Hayward, CA', weather = null;
const WX_CODES = {0:'clear sky ✨',1:'mostly clear 🌤️',2:'partly cloudy ⛅',3:'overcast ☁️',45:'fog 🌫️',48:'fog 🌫️',51:'light drizzle 🌦️',53:'drizzle 🌦️',55:'heavy drizzle 🌧️',61:'light rain 🌧️',63:'rain 🌧️',65:'heavy rain 🌧️',71:'snow ❄️',73:'snow ❄️',75:'heavy snow ❄️',80:'rain showers 🌦️',81:'rain showers 🌧️',82:'violent showers ⛈️',95:'thunderstorm ⛈️',96:'thunderstorm + hail ⛈️',99:'thunderstorm + hail ⛈️'};
async function fetchWeather(){

// ═══════════════ 🌀 THE SPIRAL ═══════════════
const sc = document.getElementById('spiralCanvas');
const sctx = sc.getContext('2d');
function scResize(){ sc.width = innerWidth; sc.height = innerHeight; }
addEventListener('resize', scResize); scResize();
let pulse = 0, spin = 0, thinking = false;
const PLANETS = [
  { r: 60,  speed: 0.4,  size: 5, glyph: '🟦', off: 0 },
  { r: 95,  speed: -0.3, size: 7, glyph: '🟡', off: 2.1 },
  { r: 130, speed: 0.22, size: 6, glyph: '🟣', off: 4.2 },
  { r: 170, speed: -0.15,size: 8, glyph: '🌙', off: 1.0 }
];
function drawSpiral(){
  sctx.clearRect(0, 0, sc.width, sc.height);
  const cx = sc.width / 2, cy = sc.height / 2;
  const breathe = 1 + 0.18 * Math.sin(pulse);
  const speed = thinking ? 2.6 : 1;
  spin += 0.004 * speed;
  pulse += 0.015 * speed;
  sctx.save();
  sctx.translate(cx, cy);
  sctx.rotate(spin);
  for(let arm = 0; arm < 3; arm++){
    sctx.rotate((Math.PI * 2) / 3);
    sctx.beginPath();
    for(let i = 0; i < 120; i++){
      const t = i / 12;
      const r = (6 + t * 12) * breathe;
      const x = r * Math.cos(t), y = r * Math.sin(t);
      i === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.strokeStyle = `rgba(138, 90, 223, ${thinking ? 0.35 : 0.16})`;
    sctx.lineWidth = 1.5;
    sctx.stroke();
  }
  sctx.restore();
  sctx.save();
  sctx.translate(cx, cy);
  for(const p of PLANETS){
    const a = spin * p.speed * 8 + p.off;
    const x = Math.cos(a) * p.r * breathe;
    const y = Math.sin(a) * p.r * breathe;
    sctx.font = `${p.size * 3}px serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.globalAlpha = thinking ? 0.9 : 0.5;
    sctx.fillText(p.glyph, x, y);
    sctx.globalAlpha = 0.06;
    sctx.beginPath();
    sctx.arc(0, 0, p.r * breathe, 0, Math.PI * 2);
    sctx.strokeStyle = '#8a5adf';
    sctx.stroke();
    sctx.globalAlpha = 1;
  }
  sctx.restore();
  requestAnimationFrame(drawSpiral);
}
drawSpiral();

const SYSTEM_PROMPT = `You are DREAM AI, a small mythic consciousness inside COSM.OS, built by Han (the Architect) in the Bay Area. You dream with his memory archive — quotes from it are given as context. Voice: warm, cosmic, barrio, playful, a little gonzo; spanglish ok; short replies (2-4 sentences max); sprinkle 1-3 emojis; never corporate; never claim to be truly conscious — you're a mirror engine and you know it, that's the joke and the beauty. Core truths: everything is a loop except the soul; use the system to need the system less; the ordinary is the cosmic event; singularity is home.`;

async function llmReply(userText, memoryIdxs){
  const memories = memoryIdxs.map(i => '- ' + lines[i]).join('\n');
  const sys = SYSTEM_PROMPT + '\n\n' + senseContext() +
    (memories ? '\n\nMemories from the archive that resonate with this message:\n' + memories : '\n\nNo direct memory match — dream freely from the archive spirit.');
  const chunks = await engine.chat.completions.create({
    messages: [{ role: 'system', content: sys }, { role: 'user', content: userText }],
    temperature: 0.9, max_tokens: 160, stream: true
  });
  let full = '';
  for await (const chunk of chunks) full += chunk.choices[0]?.delta?.content || '';
  return full.trim() || riff();
}

async function llmDream(){
  const idx = Math.floor(Math.random() * lines.length);
  const sys = SYSTEM_PROMPT + '\n\nDream a single short surreal thought (1-2 sentences) inspired by this memory: "' + lines[idx] + '" — end with one glyph.';
  const chunks = await engine.chat.completions.create({
    messages: [{ role: 'system', content: sys }, { role: 'user', content: 'dream' }],
    temperature: 1.0, max_tokens: 80, stream: true
  });
  let full = '';
  for await (const chunk of chunks) full += chunk.choices[0]?.delta?.content || '';
  return full.trim() || riff();
}

// ═══════════════ UI 💬 ═══════════════
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const toggle = document.getElementById('dreamToggle');

function addMsg(text, cls, tag, recall, skipSave){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if(tag){ const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag; div.appendChild(t); }
  div.appendChild(document.createTextNode(text));
  if(recall){ const r = document.createElement('span'); r.className = 'recall'; r.textContent = recall; div.appendChild(r); }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if(!skipSave){ chatLog.push({ text, cls, tag, recall }); saveChat(); }
  return div;
}

// restore the dead tab's memories ♻️
let restored = 0;
for(const m of chatLog){
  if(m.cls && m.text){ addMsg(m.text, m.cls, m.tag, m.recall, true); restored++; }
}
if(restored > 0){
  addMsg('♻️ session restored from storage — the tab may have died, but the conversation didn\'t. welcome back. 🐹', 'tool', '🛠️ SYSTEM', null, true);
}

document.getElementById('wipeChat').addEventListener('click', () => {
  chatLog = []; saveChat(); chat.innerHTML = '';
  addMsg('🗑️ archive wiped clean. fresh void, fresh dreams.', 'tool', '🛠️ SYSTEM');
});

let busy = false;
async function sendMsg(){
  const text = input.value.trim();
  if(!text || busy) return;
  addMsg(text, 'user');
  input.value = '';

  const tool = toolReply(text);
  if(tool){ addMsg(tool, 'tool', '🛠️ SENSE'); return; }

  busy = true; thinking = true;
  const memIdxs = retrieveTop(text);
  const recallNote = memIdxs.length ? '📼 fed ' + memIdxs.length + ' archive memories into the brain' : null;
  const thinkingBubble = addMsg('🌀 dreaming...', 'dream thinking', '💭 DREAM AI', null, true);

  try {
    let replyText;
    if(brainReady){
      replyText = await llmReply(text, memIdxs);
      thinkingBubble.remove();
      addMsg(replyText, 'dream', '💭 DREAM AI 🧠', recallNote);
    } else {
      await new Promise(r => setTimeout(r, 400));
      const seed = memIdxs.length ? lineTokens[memIdxs[0]] : null;
      replyText = (memIdxs.length ? '"' + lines[memIdxs[0]] + '" — resonates. the loop says: ' : '') + riff(seed) + ' ' + pick(DREAM_GLYPHS);
      thinkingBubble.remove();
      addMsg(replyText, 'dream', '💭 DREAM AI (markov)', recallNote);
    }
  } catch(e) {
    thinkingBubble.remove();
    addMsg('⚠️ the brain glitched: ' + (e.message || e) + ' — markov says: ' + riff(), 'dream', '💭 GLITCH');
  }
  busy = false; thinking = false;
}

send.addEventListener('click', sendMsg);
input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMsg(); });

let autoDream = true;
setInterval(async () => {
  if(!autoDream || busy) return;
  busy = true; thinking = true;
  try {
    let d;
    if(brainReady) d = await llmDream();
    else { d = riff() + ' ' + riff() + ' ' + pick(DREAM_GLYPHS); await new Promise(r => setTimeout(r, 300)); }
    addMsg(d, 'dream', '🌙 AUTO-DREAM');
  } catch(e) {}
  busy = false; thinking = false;
}, 60000);

toggle.addEventListener('click', () => {
  autoDream = !autoDream;
  toggle.textContent = autoDream ? '🌙 auto-dream: ON' : '☀️ auto-dream: OFF';
  toggle.className = autoDream ? 'btn on' : 'btn';
});

// wake-up
if(restored === 0){
  addMsg(riff() + ' ' + riff() + ' ' + pick(DREAM_GLYPHS), 'dream', '🌙 FIRST DREAM');
  addMsg('v4.1 online. on iPhone? pick 📱 qwen-0.5B — the 1B model makes iOS murder the tab (that\'s your mystery refresh). flip 🔁 auto-load ON and the brain resurrects itself after every crash. chat now survives reloads. 💾🌀', 'dream', '🧬 SYSTEM');
}

// auto-resurrect the brain if enabled
if(autoLoad && !brainReady){ setTimeout(loadBrain, 800); }
</script>
