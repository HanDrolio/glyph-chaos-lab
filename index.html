<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 GLYPH CHAOS LAB 🧿</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050f; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 16px; color: #9fd8ff;
    font-family: 'Courier New', monospace; font-size: 13px;
    pointer-events: none; text-shadow: 0 0 8px #0af;
    line-height: 1.7; user-select: none;
  }
  #mode {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 22px; letter-spacing: 4px;
    color: #fff; text-shadow: 0 0 16px currentColor; user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">🌌 GLYPH CHAOS LAB 🧿<br>click = spawn &nbsp;|&nbsp; M = mode &nbsp;|&nbsp; R = meteor &nbsp;|&nbsp; K = KABL🤯W</div>
<div id="mode">CHAOS 🌀</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const GLYPHS = ['🌌','🧿','🪬','⚡','💥','🌀','👁️','🪽','🔥','🧠','🤯','♻️','Φ','永','♾️','🟦','🟨','🦇','🪞','🌊','🧭','📡','🎧','💛','🧱','😈','✨','🛸','🫨','🌠'];

const MODES = [
  { name: 'CHAOS 🌀',     hue: () => Math.random()*360, gravity: 0.12, drag: 0.995, orbit: false, fade: 0.06 },
  { name: 'CLARIDAD 👁️',  hue: () => 190 + Math.random()*30, gravity: 0.0, drag: 0.985, orbit: true, fade: 0.03 },
  { name: 'PAZ 🕊️',       hue: () => 30 + Math.random()*30, gravity: -0.01, drag: 0.98, orbit: false, fade: 0.015 }
];
let modeIndex = 0;
const modeEl = document.getElementById('mode');
function setMode(i){
  modeIndex = i % MODES.length;
  modeEl.textContent = MODES[modeIndex].name;
}

let particles = [];
function spawn(x, y, n, power){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = (Math.random() * 0.7 + 0.3) * power;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      glyph: GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
      size: 14 + Math.random()*26,
      life: 1,
      decay: 0.004 + Math.random()*0.008,
      spin: (Math.random()-0.5)*0.2,
      rot: Math.random()*Math.PI*2,
      hue: MODES[modeIndex].hue()
    });
  }
}

let mouse = { x: innerWidth/2, y: innerHeight/2 };
canvas.addEventListener('pointerdown', e => {
  mouse = { x: e.clientX, y: e.clientY };
  spawn(e.clientX, e.clientY, 24, 8);
});
canvas.addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; });

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k === 'm') setMode(modeIndex + 1);
  if(k === 'r'){ for(let i=0;i<8;i++) spawn(Math.random()*innerWidth, Math.random()*innerHeight*0.5, 10, 6); }
  if(k === 'k'){ // 💥⚡🧠 KABL🤯W
    for(let i=0;i<5;i++) spawn(Math.random()*innerWidth, Math.random()*innerHeight, 40, 14);
    document.body.style.background = '#1a0533';
    setTimeout(()=> document.body.style.background = '#05050f', 300);
  }
});

let t = 0;
function loop(){
  t += 0.016;
  const M = MODES[modeIndex];
  ctx.fillStyle = `rgba(5,5,15,${M.fade + 0.02})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width/2, cy = canvas.height/2;

  particles = particles.filter(p => p.life > 0);
  if(particles.length > 900) particles.splice(0, particles.length - 900);

  for(const p of particles){
    if(M.orbit){
      // glyphs orbit the last click — they found their constellation
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d = Math.max(Math.hypot(dx, dy), 40);
      p.vx += (-dy / d) * 0.35 - (dx / d) * 0.02;
      p.vy += ( dx / d) * 0.35 - (dy / d) * 0.02;
    } else {
      p.vy += M.gravity;
    }
    p.vx *= M.drag; p.vy *= M.drag;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.spin;
    p.life -= p.decay;

    if(p.x < 0 || p.x > canvas.width) p.vx *= -0.9;
    if(p.y < 0 || p.y > canvas.height) p.vy *= -0.9;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.font = `${p.size}px serif`;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
    ctx.shadowBlur = 18;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.glyph, 0, 0);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}

// opening ceremony — the lab greets its Architect
spawn(innerWidth/2, innerHeight/2, 60, 10);
loop();
</script>
</body>
</html>
